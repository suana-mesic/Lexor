services:
  lexor-db:
    image: mcr.microsoft.com/mssql/server:2022-CU24-ubuntu-22.04
    container_name: lexor-db
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: ${DB_SA_PASSWORD}
    ports:
      - "1435:1433"
    expose:
      - "1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    # SQL Server needs ~20s before it accepts logins. Without this the API and worker start
    # against a dead socket. $$ escapes the variable so compose leaves it for the shell.
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 60s

  lexor-api:
    build:
      context: .
      dockerfile: Lexor.WebAPI/Dockerfile
    container_name: lexor-api
    # The database must be ready before this container starts, because migrations run during
    # startup. The broker only needs to exist: RabbitMQ can take a minute to boot, and both
    # services retry their connection to it, so blocking on its health would only make a slow
    # machine fail to come up at all.
    depends_on:
      lexor-db:
        condition: service_healthy
      lexor-rabbitmq:
        condition: service_started
    env_file:
      - ./Lexor.WebAPI/.env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=lexor-db,1433;Database=230022;User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True;"
      RabbitMQ__ConnectionString: "host=lexor-rabbitmq;username=${RABBITMQ_USER};password=${RABBITMQ_PASSWORD}"
    ports:
      - "5170:8080"
    restart: unless-stopped

  lexor-worker:
    build:
      context: .
      dockerfile: Lexor.Subscriber/Dockerfile
    container_name: lexor-worker
    depends_on:
      lexor-db:
        condition: service_healthy
      lexor-rabbitmq:
        condition: service_started
    env_file:
      - ./Lexor.Subscriber/.env
    environment:
      ConnectionStrings__DefaultConnection: "Server=lexor-db,1433;Database=230022;User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True;"
      RabbitMQ__ConnectionString: "host=lexor-rabbitmq;username=${RABBITMQ_USER};password=${RABBITMQ_PASSWORD}"
    restart: unless-stopped

  lexor-rabbitmq:
    image: rabbitmq:3-management
    container_name: lexor-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    # The broker answers on the port well before it is ready to declare exchanges, so the
    # consumers must wait for this check rather than for the container merely being up.
    # On a first run with an empty volume the broker builds its database and the diagnostics
    # command itself is slow to answer, so both the per-check timeout and the grace period
    # are generous — a check that times out must not be read as "broker is broken".
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 60s

volumes:
  sqlserver_data:
